<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Page de test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
    h1 { color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1); max-width: 600px; }
    button { background: #0078d4; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #005a9e; }
    #result { margin-top: 20px; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calculatrice simple</h1>
    <p>Entrez deux nombres et choisissez une opération.</p>
    <input type="number" id="a" placeholder="Nombre A" />
    <input type="number" id="b" placeholder="Nombre B" />
    <br><br>
    <button onclick="calc('+')">+</button>
    <button onclick="calc('-')">-</button>
    <button onclick="calc('*')">×</button>
    <button onclick="calc('/')">÷</button>
    <div id="result"></div>
  </div>
  <script>
    function calc(op) {
      const a = parseFloat(document.getElementById('a').value);
      const b = parseFloat(document.getElementById('b').value);
      let res;
      if (op === '+') res = a + b;
      else if (op === '-') res = a - b;
      else if (op === '*') res = a * b;
      else if (op === '/') res = b !== 0 ? a / b : 'Division par zéro';
      document.getElementById('result').textContent = 'Résultat : ' + res;
    }
  </script>
</body>
</html>
